<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>WeddingSCAN 시험판</title>
<style>
:root{--bg:#FFFFFF;--fg:#231A1D;--muted:#544349;--accent:#B23A5B;--line:#EEDFE3}
@media (prefers-color-scheme: dark){:root{--bg:#1B1416;--fg:#F5EDEF;--muted:#CDBBC1;--accent:#F2879F;--line:#3A2C31;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7;word-break:keep-all}
main{max-width:520px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px))}
h1{font-size:24px;margin:0 0 8px}
p{color:var(--muted)}
a.btn{display:block;margin-top:20px;padding:16px;border-radius:14px;background:var(--accent);color:#fff;text-align:center;font-weight:700;text-decoration:none}
li{margin:4px 0}
</style>
</head>
<body>
<main>
  <h1>WeddingSCAN 시험판</h1>
  <p>축의금 봉투 사진을 찍으면 AI가 번호·이름·금액을 읽어 장부로 만들어 주는 서비스의 시험 페이지입니다. 운영: 스캔웍스.</p>
  <a class="btn" href="helper/">도우미 화면 열기</a>
  <ul>
    <li>시험 비밀번호는 1234입니다. 설정에서 바꿀 수 있어요.</li>
    <li>사진을 읽으려면 Claude API 키가 필요해요. 키와 장부는 이 휴대폰에만 저장돼요.</li>
    <li>이 주소와 키를 다른 사람에게 보내지 마세요.</li>
  </ul>
</main>
</body>
</html>
