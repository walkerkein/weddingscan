<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WeddingSCAN 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Parisienne&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* WeddingSCAN 도우미 링크 시험판 (GitHub Pages) */
:root{
  --page:#F6EEF0; --bg:#FFFFFF; --surface:#FBF3F4; --line:#EEDFE3; --line-strong:#DCC6CD;
  --fg:#231A1D; --muted:#544349; --subtle:#6E5C62;
  --accent:#B23A5B; --accent-soft:#FBE8ED; --accent-ink:#8E2B47; --on-accent:#FFFFFF;
  --warn-bg:#FFF3E2; --warn-ink:#6B3A0A; --danger:#B42318; --ok-bg:#E7F4EC; --ok-ink:#17603A;
  --shadow:rgba(60,24,36,.10); --scrim:rgba(35,26,29,.45);
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-brand:'Gowun Batang','Noto Serif KR','AppleMyungjo',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#140E10; --bg:#1B1416; --surface:#251B1E; --line:#3A2C31; --line-strong:#4D3B41;
  --fg:#F5EDEF; --muted:#CDBBC1; --subtle:#A8959B;
  --accent:#F2879F; --accent-soft:#3B2028; --accent-ink:#F9C3CF; --on-accent:#2A0E16;
  --warn-bg:#3A2914; --warn-ink:#F4C98C; --danger:#FF8A80; --ok-bg:#16301F; --ok-ink:#9EDBB6;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#140E10; --bg:#1B1416; --surface:#251B1E; --line:#3A2C31; --line-strong:#4D3B41;
  --fg:#F5EDEF; --muted:#CDBBC1; --subtle:#A8959B;
  --accent:#F2879F; --accent-soft:#3B2028; --accent-ink:#F9C3CF; --on-accent:#2A0E16;
  --warn-bg:#3A2914; --warn-ink:#F4C98C; --danger:#FF8A80; --ok-bg:#16301F; --ok-ink:#9EDBB6;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
body{background:var(--page);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;gap:28px;padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:4px;line-height:1}
.logo .lw{font-family:'Parisienne','Snell Roundhand',cursive;font-size:26px;color:var(--accent);padding-top:3px}
.logo .mk{display:block;height:17px;aspect-ratio:640/137;background:var(--accent);-webkit-mask:url(logo.webp) center/contain no-repeat;mask:url(logo.webp) center/contain no-repeat}
.tag{font-size:12px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
h1{margin:0;font-family:var(--font-brand);font-size:24px;line-height:1.4;text-wrap:balance}
.lead{margin:8px 0 0;color:var(--muted)}
h2{margin:0 0 10px;font-size:17px;font-weight:700}
section{display:flex;flex-direction:column}

.rule{display:flex;gap:14px;align-items:center;padding:14px;background:var(--surface);border-radius:14px}
.env{flex:none;position:relative;width:64px;height:92px;border:1px solid var(--line-strong);border-radius:5px;background:var(--bg)}
.env b{position:absolute;left:0;right:0;text-align:center;font-size:15px;color:var(--accent)}
.env .n{top:6px}.env .a{bottom:6px}
.env span{position:absolute;right:6px;bottom:26px;writing-mode:vertical-rl;font-size:10px;color:var(--subtle)}
.rule ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg);color:var(--accent-ink);border:1.5px solid var(--line-strong)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;padding:0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.pick{position:relative}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:12px}
.th{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--bg);color:var(--muted)}
.th.done i{background:var(--ok-bg);color:var(--ok-ink)}
.th.fail i{background:var(--warn-bg);color:var(--warn-ink)}
.note{margin:10px 0 0;font-size:13px;color:var(--subtle)}
.status{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);font-size:14px;color:var(--muted)}
.status.warn{background:var(--warn-bg);color:var(--warn-ink)}
.status.ok{background:var(--ok-bg);color:var(--ok-ink)}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sum div{padding:12px 10px;border-radius:12px;background:var(--surface);min-width:0}
.sum small{display:block;font-size:12px;color:var(--subtle)}
.sum b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum .need b{color:var(--accent-ink)}
.example{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
.filter{display:flex;gap:6px;margin-bottom:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ledger li{border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:56px;padding:8px 2px;border:0;background:none;text-align:left}
.item:hover{background:var(--surface)}
.item .no{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.item .nm{font-weight:500;min-width:0}
.item .nm small{display:block;font-weight:400;font-size:12px;color:var(--subtle)}
.item .nm .flag{color:var(--warn-ink);background:var(--warn-bg);padding:1px 7px;border-radius:999px;display:inline-block;margin-top:2px}
.item .am{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.empty{padding:22px 0;text-align:center;color:var(--subtle);font-size:14px}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input{min-height:48px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--bg);font-size:16px;color:var(--fg);width:100%}
.cash{display:flex;gap:8px;align-items:flex-end}
.cash .field{flex:1;min-width:0}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:12px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sheet h3{margin:0;font-size:17px}
.sheet img{width:100%;max-height:38vh;object-fit:contain;border-radius:12px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--muted);cursor:pointer}
.consent input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.consent b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.consent em{display:block;font-style:normal;margin-top:4px;color:var(--subtle)}
.cands{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.cands div{display:flex;gap:6px;flex-wrap:wrap}
.cand{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--bg);font-size:15px;color:var(--fg)}
.cand[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.del{border:0;background:none;color:var(--danger);font-size:14px;min-height:44px;align-self:center}
.foot{font-size:12px;color:var(--subtle);text-align:center}

.head-r{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.head{flex-wrap:wrap}
.gear{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);font-size:13px;color:var(--muted)}
#view{display:flex;flex-direction:column;gap:24px}
.eyebrow{margin:0 0 6px;font-size:14px;color:var(--subtle)}
.card{padding:22px 20px;border:1px solid var(--line);border-radius:18px;background:var(--bg)}
.card.center{text-align:center;align-items:center}
.card.center h1{margin-top:12px}
.mark{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:26px}
.kv{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv dt{color:var(--subtle)}.kv dd{margin:0;font-weight:500;text-align:right;min-width:0}
.fields{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input{min-height:52px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--bg);font-size:16px;color:var(--fg);width:100%}
.field input:focus{border-color:var(--accent);outline:none}
.hint{font-size:12.5px;color:var(--subtle)}
.pin{letter-spacing:.3em;font-size:20px!important;font-weight:700}
.pin::placeholder{letter-spacing:0;font-size:16px;font-weight:400}
.err{margin:0;color:var(--danger);font-size:14px}
.btn.big{min-height:60px;font-size:17px}
.btn.danger{color:var(--danger)}
.menu{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:var(--bg);font-size:15px;text-align:left}
.menu button:last-child{border-bottom:0}
.menu i{font-style:normal;color:var(--subtle);font-size:20px}
.back{align-self:flex-start;margin-bottom:6px;min-height:40px;padding:0;border:0;background:none;color:var(--accent-ink);font-size:14px}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;padding:8px 2px;border-bottom:1px solid var(--line)}
.lrow .no{font-weight:700;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.lrow .nm{font-weight:500;min-width:0}
.lrow .nm small{display:block;font-weight:400;font-size:12px;color:var(--subtle)}
.lrow .nm .flag{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink)}
.lrow .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.check b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.foot{margin:0;font-size:12px;color:var(--subtle);text-align:center}
.rule{margin-top:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.camwrap{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;color:#fff}
.camwrap video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.cam-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;font-size:14px}
.cam-top b{font-size:15px}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#B23A5B;justify-self:center}
.shutter:active{transform:scale(.94)}
.cam-thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#222;border:2px solid #fff}
.cam-thumb img{width:100%;height:100%;object-fit:cover}
.cam-done{justify-self:end;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:#231A1D;font-weight:700}
.cam-msg{margin:0;padding:8px 16px;font-size:13px;text-align:center;min-height:36px}
.cam-msg.warn{background:#6B3A0A;color:#FFE7C2}
.th .blur{position:absolute;right:4px;top:4px;font-style:normal;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink)}
.keybox{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:14px;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tools{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head">
    <div class="logo" role="img" aria-label="WeddingSCAN"><span class="lw" aria-hidden="true">Wedding</span><span class="mk" aria-hidden="true"></span></div>
    <div class="head-r"><span class="tag">도우미 · 시험판</span><button class="gear" id="gearBtn" aria-label="시험 설정">설정</button></div>
  </div>
  <main id="view" aria-live="polite"></main>
  <p class="foot">운영: 스캔웍스 · 시험판은 장부와 키를 이 휴대폰에만 저장해요</p>
</div>
<input id="camIn" type="file" accept="image/*" capture="environment" hidden>
<input id="albumIn" type="file" accept="image/*" multiple hidden>
<div class="camwrap" id="camLayer" hidden role="dialog" aria-label="봉투 촬영">
  <div class="cam-top"><b>봉투 촬영</b><span id="camCount">0장</span></div>
  <video id="camVideo" playsinline muted autoplay></video>
  <p class="cam-msg" id="camMsg"></p>
  <div class="cam-bar"><div class="cam-thumb" id="camThumb"></div><button class="shutter" id="camShutter" aria-label="찍기"></button><button class="cam-done" id="camDone">다 찍었어요</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
